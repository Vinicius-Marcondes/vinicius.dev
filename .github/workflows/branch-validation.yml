name: branch-validation

on:
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: branch-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-validation:
    name: Frontend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  backend-validation:
    name: Backend Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run prisma:generate

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Verify policy checks
        run: bun run verify
